<!DOCTYPE html>
<html lang="de" class="fbl-lock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>NFL POINTS - Wette mit Freunden auf NFL Spiele</title>

  <!-- Preload für kritische Ressourcen -->
  <link rel="preload" href="css/colors.css" as="style">
  <link rel="preload" href="css/base.css" as="style">
  <link rel="preload" href="css/football-loader.css" as="style">
  <link rel="preload" href="css/landing.css" as="style">
  <link rel="preload" href="logos/nfl-logo.svg" as="image">

  <!-- CSS Files -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/base.css">
  <!-- Vor allem anderen CSS geladen, da der Ladebildschirm unten im body
       als erstes Element schon vor jedem JS sichtbar sein soll -->
  <link rel="stylesheet" href="css/football-loader.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/mobile.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Statischer Ladebildschirm - schon sichtbar, bevor irgendein JS läuft
       (Animation läuft rein über CSS). Startseite entscheidet erst weiter
       unten synchron per localStorage, ob wirklich ein Ladevorgang ansteht
       (bekannter Nutzer, wird zu games.html weitergeleitet) oder ob
       stattdessen der Login-Bildschirm gezeigt werden soll (kein
       gespeicherter Nutzer) - verhindert, dass für einen bekannten Nutzer
       kurz der Login-Bildschirm aufblitzt, bevor die Weiterleitung greift. -->
  <div class="fbl-overlay fbl-overlay--nfl" id="page-loader">
    <div class="fbl fbl--line fbl--nfl">
      <div class="fbl-nfl-brand"><img class="fbl-nfl-brand-logo" src="icons/icon-inverted.png" alt="NFL POINTS"><div class="fbl-nfl-brand-text">NFL POINTS</div></div>
      <svg class="fbl-nfl-icon" viewBox="-72 -72 144 144" aria-hidden="true" focusable="false">
        <defs><clipPath id="page-loader-clip"><path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/></clipPath></defs>
        <g transform="rotate(-45)">
          <path class="fbl-nfl-streak fbl-nfl-streak--1" d="M-61.5 -10.6H-85.5" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--2" d="M-67.2 5.9H-89.8" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--3" d="M-61.5 24.4H-72.3" pathLength="100"/>
        </g>
        <g clip-path="url(#page-loader-clip)"><g transform="rotate(-45)">
          <g class="fbl-nfl-laces"><path d="M-24 0H24M-20.5 -6.9V6.9M-7.5 -6.9V6.9M7.5 -6.9V6.9M20.5 -6.9V6.9"/></g>
        </g></g>
        <path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/>
      </svg>
    </div>
  </div>
  <div id="app" class="landing-page hidden">
    <!-- Hero Section -->
    <div class="hero-section">
      <div class="hero-content">
        <!-- NFL Logo with Glow -->
        <div class="hero-logo-container">
          <div class="hero-logo-glow"></div>
          <img src="logos/nfl-logo.svg" alt="NFL Logo" class="hero-logo">
        </div>
        
        <h1 class="hero-title">NFL POINTS</h1>
        <p class="hero-subtitle" data-i18n="hero_subtitle">Wette mit Freunden auf NFL Spiele</p>

        <div class="hero-buttons">
          <button class="btn btn-primary btn-lg hover-lift" data-testid="register-button" onclick="openModal('register')">
            <i class="fas fa-user-plus"></i>
            <span data-i18n="btn_register">Registrieren</span>
          </button>
          <button class="btn btn-secondary btn-lg hover-lift" data-testid="login-button" onclick="openModal('login')">
            <i class="fas fa-sign-in-alt"></i>
            <span data-i18n="btn_login">Anmelden</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="landing-footer">
      <p class="footer-text">made by MBP</p>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">Anmelden</h2>
      
      <form id="auth-form" onsubmit="handleAuth(event)">
        <!-- Username Field (only for register) -->
        <div id="username-field" class="form-group hidden">
          <label class="form-label" data-i18n="label_username">Benutzername</label>
          <input
            type="text"
            id="username-input"
            class="form-input"
            placeholder="Dein Benutzername"
            data-i18n-placeholder="placeholder_username"
            data-testid="username-input"
          >
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="label_email">E-Mail</label>
          <input
            type="email"
            id="email-input"
            class="form-input"
            placeholder="deine@email.de"
            data-i18n-placeholder="placeholder_email"
            required
            data-testid="email-input"
          >
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="label_password">Passwort</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password-input"
              class="form-input"
              placeholder="••••••••"
              required
              minlength="6"
              data-testid="password-input"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password-input', this)" tabindex="-1" aria-label="Passwort anzeigen" data-testid="toggle-password-visibility">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <p id="forgot-password-row" class="auth-switch" style="margin-top: -8px; margin-bottom: 16px; text-align: right;">
          <button type="button" class="text-link" onclick="openForgotPasswordModal()" data-testid="forgot-password-link" data-i18n="forgot_password_link">
            Passwort vergessen?
          </button>
        </p>

        <div id="auth-error" class="error-message hidden" data-testid="auth-error"></div>

        <button type="submit" class="btn btn-accent btn-full" data-testid="submit-auth">
          <span id="submit-text">Anmelden</span>
          <i id="submit-spinner" class="fas fa-spinner fa-spin hidden"></i>
        </button>

        <p class="auth-switch">
          <span id="switch-text">Noch kein Konto?</span>
          <button type="button" id="switch-btn" class="text-link" onclick="switchAuthMode()" data-testid="switch-to-register">
            Registrieren
          </button>
        </p>
      </form>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgot-password-modal" class="modal">
    <div class="modal-backdrop" onclick="closeForgotPasswordModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="title_reset_password">Passwort zurücksetzen</h2>

      <p style="color: var(--muted); margin-bottom: 20px; text-align: center;" data-i18n="reset_password_text">
        Wir senden dir eine E-Mail mit einem Link zum Zurücksetzen deines Passworts.
      </p>

      <div class="form-group">
        <label class="form-label" data-i18n="label_email">E-Mail</label>
        <input
          type="email"
          id="forgot-password-email"
          class="form-input"
          placeholder="deine@email.de"
          data-i18n-placeholder="placeholder_email"
          required
          data-testid="forgot-password-email"
        >
      </div>

      <div id="forgot-password-error" class="error-message hidden"></div>
      <div id="forgot-password-success" class="success-message hidden" style="background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.2); color: var(--success); padding: 12px; border-radius: 8px; margin-bottom: 16px;"></div>

      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeForgotPasswordModal()" data-i18n="btn_cancel">
          Abbrechen
        </button>
        <button class="btn btn-primary" style="flex: 1;" onclick="sendForgotPasswordEmail()" data-testid="send-forgot-password">
          <i class="fas fa-paper-plane"></i> <span data-i18n="btn_send_email">E-Mail senden</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK - Async Loading for Performance -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/football-loader.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Initialize Firebase when SDK is loaded -->
  <script>
    function waitForFirebaseSDK() {
      return new Promise((resolve) => {
        const check = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.app && firebase.auth && firebase.firestore) {
            clearInterval(check);
            resolve();
          }
        }, 50);
        // Timeout after 10 seconds
        setTimeout(() => { clearInterval(check); resolve(); }, 10000);
      });
    }
    
    // WICHTIG (2026-09-23): checkAuth() - die Funktion, die einen bereits
    // angemeldeten Nutzer automatisch zu pages/games.html weiterleitet -
    // wurde bisher NUR auf jeder Unterseite aufgerufen (siehe deren eigene
    // DOMContentLoaded-Handler, z.B. games.js), aber nie hier auf der
    // Startseite selbst. Da die App laut PWA-Manifest (start_url) immer
    // zuerst hier landet, hat das dazu geführt, dass Nutzer bei JEDEM
    // App-Start den Login-Bildschirm sahen und sich manuell neu anmelden
    // mussten - unabhängig davon, ob ihre Sitzung im Hintergrund eigentlich
    // noch gültig war. Vermutlich die eigentliche, vollständige Ursache
    // fürs wiederholt gemeldete Ausloggen-Problem.
    //
    // WICHTIG (2026-09-25): checkAuth() selbst leitet zwar korrekt weiter,
    // tut das aber erst NACHDEM (1) waitForFirebaseSDK() auf die drei
    // Google-CDN-Skripte gewartet hat, (2) initializeFirebase() durchgelaufen
    // ist, UND (3) waitForAuth() den kompletten Firebase-Zyklus (Persistenz,
    // onAuthStateChanged, getIdToken(), ein Firestore-Read fürs Nutzerprofil)
    // abgewartet hat - mehrere Netzwerk-Roundtrips nur um zu entscheiden, ob
    // weitergeleitet wird. Auf einer langsamen Verbindung (typisch beim
    // App-Start der installierten Android-App) macht sich das als spürbare
    // Verzögerung auf dem Startbildschirm bemerkbar. localStorage kennt die
    // Antwort aber schon sofort und synchron, ganz ohne Firebase - also
    // optimistisch SOFORT weiterleiten, wenn dort ein Nutzer aus der letzten
    // Sitzung hinterlegt ist. Die eigentliche Verifizierung (ist die Sitzung
    // WIRKLICH noch gültig?) läuft danach ganz normal auf games.html selbst
    // ab (ruft in seinem eigenen DOMContentLoaded-Handler ebenfalls
    // checkAuth() auf) - stellt sich die Sitzung dort als ungültig heraus,
    // wird von dort wieder hierher zurückgeleitet (bestehendes Verhalten,
    // siehe checkAuth() in auth.js). Im Normalfall (Sitzung noch gültig, die
    // riesige Mehrheit der Fälle) spart das den kompletten Firebase-Roundtrip
    // auf dem Startbildschirm.
    if (localStorage.getItem('user')) {
      // Bekannter Nutzer: Ladebildschirm bleibt genau so sichtbar, wie er
      // schon beim ersten Paint war (kein Umschalten, kein Aufblitzen) - die
      // Weiterleitung nimmt ihn quasi "mit" zu games.html, das ihn seinerseits
      // schon als statisches Element mitbringt (siehe initPageWithLoader()
      // in main.js).
      window.location.href = 'pages/games.html';
    } else {
      // Kein gespeicherter Nutzer: hier gibt es nichts zu laden - Ladebild-
      // schirm ausblenden und stattdessen den Login-Bildschirm zeigen.
      document.getElementById('page-loader').classList.add('is-hidden');
      document.documentElement.classList.remove('fbl-lock');
      document.getElementById('app').classList.remove('hidden');
      waitForFirebaseSDK().then(async () => {
        if (typeof initializeFirebase === 'function') {
          initializeFirebase();
        }
        if (typeof checkAuth === 'function') {
          await checkAuth();
        }
      });
    }
  </script>
</body>
</html>
