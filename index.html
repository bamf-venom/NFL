<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script>
    // TEMPORÄRE DIAGNOSE (2026-09-23, Runde 4) - läuft als Allererstes, vor
    // jedem anderen Script, und erstellt eine kurze Zusammenfassung statt
    // aller einzelnen Key-Namen (war unübersichtlich). WICHTIG: dieser
    // allererste Check läuft VOR Firebase/firebase-config.js - der dortige
    // Aufräum-Code (pruneGroupBetsCacheIfNeeded) hat zu diesem Zeitpunkt noch
    // NICHT gelaufen. window.__storageSummary() kann deshalb jederzeit erneut
    // aufgerufen werden (z.B. nach ein paar Sekunden), um den Zustand NACH
    // der Firebase-Initialisierung zu sehen. Wieder entfernen sobald
    // bestätigt ist, dass das Ausloggen-Problem behoben ist.
    window.__storageSummary = function() {
      try {
        var keys = Object.keys(localStorage);
        var groupBetsCount = keys.filter(function(k) { return k.indexOf('nflp_cache_groupBets_') === 0; }).length;
        var authKey = keys.find(function(k) { return k.indexOf('firebase:authUser:') === 0; });
        var authLog = JSON.parse(localStorage.getItem('nflp_auth_debug_log') || '[]');
        return (authKey ? 'AUTH KEY DA' : 'AUTH KEY WEG') +
          ' | Gesamt: ' + keys.length + ' Keys, davon groupBets-Cache: ' + groupBetsCount +
          ' | Auth-Log: [' + authLog.join(' ; ') + ']';
      } catch (e) {
        return 'STORAGE ERROR: ' + e.message;
      }
    };
    window.__storageDebugMessage = 'Beim Laden: ' + window.__storageSummary();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>NFL POINTS - Wette mit Freunden auf NFL Spiele</title>
  
  <!-- Preload für kritische Ressourcen -->
  <link rel="preload" href="css/colors.css" as="style">
  <link rel="preload" href="css/base.css" as="style">
  <link rel="preload" href="css/landing.css" as="style">
  <link rel="preload" href="logos/nfl-logo.svg" as="image">
  
  <!-- CSS Files -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/mobile.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <script>
    // Sichtbares Diagnose-Banner statt alert(). Aktualisiert sich nach 4
    // Sekunden nochmal selbst, damit auch der Zustand NACH der Firebase-
    // Initialisierung (inkl. pruneGroupBetsCacheIfNeeded) sichtbar wird,
    // nicht nur der Zustand beim allerersten Laden.
    if (window.__storageDebugMessage) {
      document.write('<div id="storage-debug-banner" style="position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'background:#ffcc00;color:#000;font-family:monospace;font-size:12px;padding:10px 12px;' +
        'word-break:break-word;box-shadow:0 2px 8px rgba(0,0,0,0.4);">' +
        window.__storageDebugMessage.replace(/</g, '&lt;') + '</div>');
      var pollCount = 0;
      var pollForFirebaseReady = setInterval(function() {
        pollCount++;
        var ready = (typeof firebaseReady !== 'undefined' && firebaseReady === true);
        if (ready || pollCount > 16) { // max ~8s (16 * 500ms)
          clearInterval(pollForFirebaseReady);
          var el = document.getElementById('storage-debug-banner');
          if (el && window.__storageSummary) {
            el.textContent = window.__storageDebugMessage +
              ' || Nach Firebase-Init (' + (ready ? 'fertig' : 'Timeout nach 8s') + '): ' + window.__storageSummary();
          }
        }
      }, 500);
    }
  </script>
  <div id="app" class="landing-page">
    <!-- Hero Section -->
    <div class="hero-section">
      <div class="hero-content">
        <!-- NFL Logo with Glow -->
        <div class="hero-logo-container">
          <div class="hero-logo-glow"></div>
          <img src="logos/nfl-logo.svg" alt="NFL Logo" class="hero-logo">
        </div>
        
        <h1 class="hero-title">NFL POINTS</h1>
        <p class="hero-subtitle" data-i18n="hero_subtitle">Wette mit Freunden auf NFL Spiele</p>

        <div class="hero-buttons">
          <button class="btn btn-primary btn-lg hover-lift" data-testid="register-button" onclick="openModal('register')">
            <i class="fas fa-user-plus"></i>
            <span data-i18n="btn_register">Registrieren</span>
          </button>
          <button class="btn btn-secondary btn-lg hover-lift" data-testid="login-button" onclick="openModal('login')">
            <i class="fas fa-sign-in-alt"></i>
            <span data-i18n="btn_login">Anmelden</span>
          </button>
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="landing-footer">
      <p class="footer-text">made by MBP</p>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">Anmelden</h2>
      
      <form id="auth-form" onsubmit="handleAuth(event)">
        <!-- Username Field (only for register) -->
        <div id="username-field" class="form-group hidden">
          <label class="form-label" data-i18n="label_username">Benutzername</label>
          <input
            type="text"
            id="username-input"
            class="form-input"
            placeholder="Dein Benutzername"
            data-i18n-placeholder="placeholder_username"
            data-testid="username-input"
          >
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="label_email">E-Mail</label>
          <input
            type="email"
            id="email-input"
            class="form-input"
            placeholder="deine@email.de"
            data-i18n-placeholder="placeholder_email"
            required
            data-testid="email-input"
          >
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="label_password">Passwort</label>
          <input 
            type="password" 
            id="password-input"
            class="form-input" 
            placeholder="••••••••"
            required
            minlength="6"
            data-testid="password-input"
          >
        </div>
        
        <div id="auth-error" class="error-message hidden" data-testid="auth-error"></div>
        
        <button type="submit" class="btn btn-accent btn-full" data-testid="submit-auth">
          <span id="submit-text">Anmelden</span>
          <i id="submit-spinner" class="fas fa-spinner fa-spin hidden"></i>
        </button>
        
        <p class="auth-switch">
          <span id="switch-text">Noch kein Konto?</span>
          <button type="button" id="switch-btn" class="text-link" onclick="switchAuthMode()" data-testid="switch-to-register">
            Registrieren
          </button>
        </p>
      </form>
    </div>
  </div>

  <!-- Firebase SDK - Async Loading for Performance -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  
  <!-- Initialize Firebase when SDK is loaded -->
  <script>
    function waitForFirebaseSDK() {
      return new Promise((resolve) => {
        const check = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.app && firebase.auth && firebase.firestore) {
            clearInterval(check);
            resolve();
          }
        }, 50);
        // Timeout after 10 seconds
        setTimeout(() => { clearInterval(check); resolve(); }, 10000);
      });
    }
    
    // WICHTIG (2026-09-23): checkAuth() - die Funktion, die einen bereits
    // angemeldeten Nutzer automatisch zu pages/games.html weiterleitet -
    // wurde bisher NUR auf jeder Unterseite aufgerufen (siehe deren eigene
    // DOMContentLoaded-Handler, z.B. games.js), aber nie hier auf der
    // Startseite selbst. Da die App laut PWA-Manifest (start_url) immer
    // zuerst hier landet, hat das dazu geführt, dass Nutzer bei JEDEM
    // App-Start den Login-Bildschirm sahen und sich manuell neu anmelden
    // mussten - unabhängig davon, ob ihre Sitzung im Hintergrund eigentlich
    // noch gültig war. Vermutlich die eigentliche, vollständige Ursache
    // fürs wiederholt gemeldete Ausloggen-Problem.
    waitForFirebaseSDK().then(async () => {
      if (typeof initializeFirebase === 'function') {
        initializeFirebase();
      }
      if (typeof checkAuth === 'function') {
        await checkAuth();
      }
    });
  </script>
</body>
</html>
