<!DOCTYPE html>
<html lang="de" class="fbl-lock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Gruppen - NFL POINTS</title>
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/base.css">
  <!-- Vor allem anderen CSS geladen, da der Ladebildschirm unten im body
       als erstes Element schon vor jedem JS sichtbar sein soll -->
  <link rel="stylesheet" href="../css/football-loader.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/leaderboard-groups.css">
  <link rel="stylesheet" href="../css/profile-admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Statischer Ladebildschirm - schon sichtbar, bevor irgendein JS läuft
       (Animation läuft rein über CSS), damit beim Seitenwechsel nie kurz
       die halbfertige Seite aufblitzt. js/football-loader.js übernimmt
       dieses Element beim ersten FootballLoader.show()-Aufruf (siehe
       initPageWithLoader() in main.js) statt ein zweites zu erzeugen, und
       blendet es aus, sobald die echten Seitendaten da sind. -->
  <div class="fbl-overlay fbl-overlay--nfl" id="page-loader">
    <div class="fbl fbl--line fbl--nfl">
      <div class="fbl-nfl-brand"><img class="fbl-nfl-brand-logo" src="../icons/icon-inverted.png" alt="NFL POINTS"><div class="fbl-nfl-brand-text">NFL POINTS</div></div>
      <svg class="fbl-nfl-icon" viewBox="-72 -72 144 144" aria-hidden="true" focusable="false">
        <defs><clipPath id="page-loader-clip"><path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/></clipPath></defs>
        <g transform="rotate(-45)">
          <path class="fbl-nfl-streak fbl-nfl-streak--1" d="M-61.5 -10.6H-85.5" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--2" d="M-67.2 5.9H-89.8" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--3" d="M-61.5 24.4H-72.3" pathLength="100"/>
        </g>
        <g clip-path="url(#page-loader-clip)"><g transform="rotate(-45)">
          <g class="fbl-nfl-laces"><path d="M-24 0H24M-20.5 -6.9V6.9M-7.5 -6.9V6.9M7.5 -6.9V6.9M20.5 -6.9V6.9"/></g>
        </g></g>
        <path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/>
      </svg>
    </div>
  </div>
  <div id="navbar-container"></div>
  <main class="main-content">
    <div class="container container-sm">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title" style="display: flex; align-items: center; gap: 12px;" data-testid="groups-title">
              <i class="fas fa-users"></i>
              <span data-i18n="groups_title">Meine Gruppen</span>
            </h1>
            <p class="page-subtitle" data-i18n="groups_subtitle">Wette mit deinen Freunden</p>
          </div>
          <div class="groups-buttons">
            <button class="btn btn-secondary" onclick="openJoinModal()" data-testid="join-group-btn">
              <i class="fas fa-link"></i>
              <span data-i18n="btn_join">Beitreten</span>
            </button>
            <button class="btn btn-primary" onclick="openCreateModal()" data-testid="create-group-btn">
              <i class="fas fa-plus"></i>
              <span data-i18n="new_group">Neue Gruppe</span>
            </button>
          </div>
        </div>
      </div>
      <!-- Success Message -->
      <div id="success-message" class="success-message hidden" style="margin-bottom: 24px;">
        <i class="fas fa-check"></i>
        <span id="success-text"></span>
      </div>
      <!-- Groups List -->
      <div id="groups-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </main>
  <!-- Create Group Modal -->
  <div id="create-modal" class="modal">
    <div class="modal-backdrop" onclick="closeCreateModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="create_group_title">Neue Gruppe erstellen</h2>
      <form onsubmit="handleCreateGroup(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="label_group_name">Gruppenname</label>
          <input type="text" id="group-name-input" class="form-input" placeholder="z.B. NFL Experten" data-i18n-placeholder="placeholder_group_name" required maxlength="50" data-testid="group-name-input">
        </div>
        <div id="create-error" class="error-message hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="btn_create_group">
          Gruppe erstellen
        </button>
      </form>
    </div>
  </div>
  <!-- Join Group Modal -->
  <div id="join-modal" class="modal">
    <div class="modal-backdrop" onclick="closeJoinModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="join_group_title">Gruppe beitreten</h2>
      <form onsubmit="handleJoinGroup(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="label_invite_code">Einladungscode</label>
          <input type="text" id="invite-code-input" class="form-input" placeholder="z.B. ABC12345" data-i18n-placeholder="placeholder_invite_code" required maxlength="8" style="text-transform: uppercase; letter-spacing: 2px; text-align: center; font-size: 18px;" data-testid="invite-code-input">
          <p style="font-size: 12px; color: var(--muted); margin-top: 8px; text-align: center;" data-i18n="invite_code_hint">
            Frage einen Freund nach dem Einladungscode
          </p>
        </div>
        <div id="join-error" class="error-message hidden"></div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="btn_join">
          Beitreten
        </button>
      </form>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/football-loader.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/groups.js"></script>
</body>
</html>
