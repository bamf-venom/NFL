<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangliste - NFL POINTS</title>
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/leaderboard-groups.css">
  <link rel="stylesheet" href="../css/profile-admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="nfl-loader" aria-hidden="true">
    <div class="nfl-loader-stage">
      <div class="nfl-loader-spin">
        <svg class="nfl-loader-ball-svg" viewBox="0 0 100 56" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="nflBallGrad" x1="15%" y1="10%" x2="90%" y2="95%">
              <stop offset="0%" stop-color="#c17d45"/>
              <stop offset="50%" stop-color="#8a4a22"/>
              <stop offset="100%" stop-color="#5c2f13"/>
            </linearGradient>
          </defs>
          <path d="M5,28 Q50,2 95,28 Q50,54 5,28 Z" fill="url(#nflBallGrad)"/>
          <path d="M21,28 L79,28" stroke="#f2e6d8" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M37,21 L37,35 M45,19 L45,37 M55,19 L55,37 M63,21 L63,35" stroke="#f2e6d8" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="nfl-loader-shadow"></div>
    </div>
    <div class="nfl-loader-label">Lädt</div>
  </div>
  <div id="navbar-container"></div>
  <main class="main-content">
    <div class="container container-sm">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-row">
          <div class="leaderboard-header">
            <div class="leaderboard-icon">
              <i class="fas fa-trophy fa-lg"></i>
            </div>
            <div>
              <h1 class="page-title" data-testid="leaderboard-title">Rangliste</h1>
              <p class="page-subtitle">Die besten Tipper der Saison</p>
            </div>
          </div>
          <div class="filter-container">
            <i class="fas fa-filter text-muted"></i>
            <select id="group-filter" class="form-input" style="min-width: 180px;" data-testid="group-filter">
              <option value="global">Global</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Selected Group Info -->
      <div id="group-info" class="hidden" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 8px; margin-bottom: 24px;">
        <i class="fas fa-users"></i>
        <span>Zeige Rangliste für: <strong id="group-name" style="color: white;"></strong></span>
      </div>
      <!-- Leaderboard -->
      <div id="leaderboard-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  <script src="../js/config.js"></script>
  <script src="../js/loader.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/leaderboard.js"></script>
  <script>
    function waitForFirebaseSDK() {
      return new Promise((resolve) => {
        const check = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.app && firebase.auth && firebase.firestore) {
            clearInterval(check);
            resolve();
          }
        }, 50);
        setTimeout(() => { clearInterval(check); resolve(); }, 10000);
      });
    }
    waitForFirebaseSDK().then(() => {
      if (typeof initializeFirebase === 'function') initializeFirebase();
    });
  </script>
</body>
</html>
