<!DOCTYPE html>
<html lang="de" class="fbl-lock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Spiele - NFL POINTS</title>

  <!-- Preload kritische CSS für schnelleres Laden -->
  <link rel="preload" href="../css/colors.css" as="style">
  <link rel="preload" href="../css/base.css" as="style">
  <link rel="preload" href="../css/football-loader.css" as="style">
  <link rel="preload" href="../css/games.css" as="style">

  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/base.css">
  <!-- Vor allem anderen CSS geladen, da der Ladebildschirm unten im body
       als erstes Element schon vor jedem JS sichtbar sein soll -->
  <link rel="stylesheet" href="../css/football-loader.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/leaderboard-groups.css">
  <link rel="stylesheet" href="../css/profile-admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/mobile.css">

  <!-- Fonts mit display=swap für bessere Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Statischer Ladebildschirm - schon sichtbar, bevor irgendein JS läuft
       (Animation läuft rein über CSS), damit beim Seitenwechsel nie kurz
       die halbfertige Seite aufblitzt. js/football-loader.js übernimmt
       dieses Element beim ersten FootballLoader.show()-Aufruf (siehe
       initPageWithLoader() in main.js) statt ein zweites zu erzeugen, und
       blendet es aus, sobald die echten Seitendaten da sind. -->
  <div class="fbl-overlay fbl-overlay--nfl" id="page-loader">
    <div class="fbl fbl--line fbl--nfl">
      <div class="fbl-nfl-brand"><img class="fbl-nfl-brand-logo" src="../icons/icon-inverted.png" alt="NFL POINTS"><div class="fbl-nfl-brand-text">NFL POINTS</div></div>
      <svg class="fbl-nfl-icon" viewBox="-72 -72 144 144" aria-hidden="true" focusable="false">
        <defs><clipPath id="page-loader-clip"><path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/></clipPath></defs>
        <g transform="rotate(-45)">
          <path class="fbl-nfl-streak fbl-nfl-streak--1" d="M-61.5 -10.6H-85.5" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--2" d="M-67.2 5.9H-89.8" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--3" d="M-61.5 24.4H-72.3" pathLength="100"/>
        </g>
        <g clip-path="url(#page-loader-clip)"><g transform="rotate(-45)">
          <g class="fbl-nfl-laces"><path d="M-24 0H24M-20.5 -6.9V6.9M-7.5 -6.9V6.9M7.5 -6.9V6.9M20.5 -6.9V6.9"/></g>
        </g></g>
        <path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/>
      </svg>
    </div>
  </div>
  <div id="navbar-container"></div>
  <main class="main-content">
    <div class="container" id="games-list-view">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title" data-testid="games-title" data-i18n="games_title">Spiele</h1>
            <p class="page-subtitle" data-i18n="games_subtitle">Wähle ein Spiel und platziere deine Wette</p>
          </div>
          <div class="filter-container">
            <i class="fas fa-filter text-muted"></i>
            <select id="season-filter" class="form-input" style="width: auto; min-width: 140px;" data-testid="season-filter">
            </select>
            <select id="week-filter" class="form-input" style="width: auto; min-width: 140px;" data-testid="week-filter">
              <option value="">Alle Wochen</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Games List -->
      <div id="games-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>

    <!-- Spiel-Detail-Ansicht - wird per JS ein-/ausgeblendet statt auf eine
         eigene Seite zu navigieren (siehe openGameDetail/closeGameDetail in
         games.js), damit der Wechsel Spiele-Liste <-> Spiel-Detail ohne
         kompletten Seiten-Reload (Firebase-Neuinitialisierung etc.) läuft -
         das war der Hauptgrund für die lange Ladezeit beim Zurückgehen. -->
    <div class="container container-sm hidden" id="game-detail-view">
      <a href="#" class="back-link" data-testid="back-button" onclick="closeGameDetail(); return false;">
        <i class="fas fa-arrow-left"></i>
        <span data-i18n="back_to_games">Zurück zu den Spielen</span>
      </a>
      <div id="game-detail-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Bet Modal -->
  <div id="edit-bet-modal" class="modal">
    <div class="modal-backdrop" onclick="closeEditBetModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="edit_bet_title">Wette bearbeiten</h2>
      <p style="text-align: center; margin-bottom: 16px; color: var(--muted);" id="edit-bet-teams"></p>
      <form onsubmit="handleEditBet(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" id="edit-bet-away-label">Gast Punkte</label>
            <input type="number" id="edit-bet-away-score" class="form-input" min="0" max="100" required data-testid="edit-away-score-input">
          </div>
          <div class="form-group">
            <label class="form-label" id="edit-bet-home-label">Heim Punkte</label>
            <input type="number" id="edit-bet-home-score" class="form-input" min="0" max="100" required data-testid="edit-home-score-input">
          </div>
        </div>
        <div id="edit-bet-error" class="error-message hidden"></div>
        <div id="edit-bet-success" class="success-message hidden" data-i18n="edit_bet_success">Wette erfolgreich aktualisiert!</div>
        <p style="font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 16px;" data-i18n="edit_bet_hint">
          Du kannst deine Wette bis 24 Stunden vor Spielbeginn bearbeiten
        </p>
        <button type="submit" class="btn btn-primary btn-full" data-testid="save-edit-bet-button" data-i18n="btn_save_changes">
          Änderungen speichern
        </button>
      </form>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/football-loader.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/vendor/confetti.browser.min.js"></script>
  <script src="../js/celebration.js"></script>
  <script src="../js/games.js"></script>
  <script src="../js/game-detail.js"></script>
</body>
</html>
