<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiele - NFL POINTS</title>
  
  <!-- Preload kritische CSS für schnelleres Laden -->
  <link rel="preload" href="../css/colors.css" as="style">
  <link rel="preload" href="../css/base.css" as="style">
  <link rel="preload" href="../css/games.css" as="style">
  
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/leaderboard-groups.css">
  <link rel="stylesheet" href="../css/profile-admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/loader.css">
  <link rel="stylesheet" href="../css/mobile.css">
  
  <!-- Fonts mit display=swap für bessere Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div id="nfl-loader" aria-hidden="true">
    <div class="nfl-loader-bottom">
      <svg class="nfl-loader-ball-outline" viewBox="0 0 44 26" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="nflSeamFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
            <stop offset="50%" stop-color="#fff" stop-opacity="1"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
          <mask id="nflSeamMask" maskUnits="userSpaceOnUse" x="-20" y="-10" width="84" height="46">
            <rect class="nfl-loader-seam-sweep" x="-9" y="-3" width="18" height="32" fill="url(#nflSeamFade)"/>
          </mask>
        </defs>
        <g class="nfl-loader-ball-tilt">
          <path d="M4,13 Q22,2 40,13 Q22,24 4,13 Z" fill="none" stroke="#e8eaf0" stroke-width="2" stroke-linejoin="round"/>
          <g mask="url(#nflSeamMask)">
            <path d="M13,13 L31,13" stroke="#e8eaf0" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M18,10.5 L18,15.5 M22,10 L22,16 M26,10.5 L26,15.5" stroke="#e8eaf0" stroke-width="1.3" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
    </div>
  </div>
  <div id="navbar-container"></div>
  <main class="main-content">
    <div class="container">
      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-row">
          <div>
            <h1 class="page-title" data-testid="games-title">Spiele</h1>
            <p class="page-subtitle">Wähle ein Spiel und platziere deine Wette</p>
          </div>
          <div class="filter-container">
            <i class="fas fa-filter text-muted"></i>
            <select id="season-filter" class="form-input" style="width: auto; min-width: 140px;" data-testid="season-filter">
            </select>
            <select id="week-filter" class="form-input" style="width: auto; min-width: 140px;" data-testid="week-filter">
              <option value="">Alle Wochen</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Games List -->
      <div id="games-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  <script src="../js/config.js"></script>
  <script src="../js/loader.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/custom-select.js"></script>
  <script src="../js/games.js"></script>
  <script>
    function waitForFirebaseSDK() {
      return new Promise((resolve) => {
        const check = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.app && firebase.auth && firebase.firestore) {
            clearInterval(check);
            resolve();
          }
        }, 50);
        setTimeout(() => { clearInterval(check); resolve(); }, 10000);
      });
    }
    waitForFirebaseSDK().then(() => {
      if (typeof initializeFirebase === 'function') initializeFirebase();
    });
  </script>
</body>
</html>
