<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiel Details - NFL POINTS</title>
  <!-- Die Spiel-Detail-Ansicht läuft jetzt direkt in games.html (siehe
       openGameDetail() in js/games.js), damit der Wechsel Liste <-> Detail
       ohne kompletten Seiten-Reload passiert. Diese Datei bleibt als reiner
       Redirect bestehen, damit alte Links/Lesezeichen (game-detail.html?id=X)
       weiter funktionieren. -->
  <script>
    const id = new URLSearchParams(location.search).get('id');
    location.replace('games.html' + (id ? '?game=' + encodeURIComponent(id) : ''));
  </script>
</head>
<body></body>
</html>
