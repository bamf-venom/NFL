<!DOCTYPE html>
<html lang="de" class="fbl-lock">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Gruppe - NFL POINTS</title>
  <link rel="stylesheet" href="../css/colors.css">
  <link rel="stylesheet" href="../css/base.css">
  <!-- Vor allem anderen CSS geladen, da der Ladebildschirm unten im body
       als erstes Element schon vor jedem JS sichtbar sein soll -->
  <link rel="stylesheet" href="../css/football-loader.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/leaderboard-groups.css">
  <link rel="stylesheet" href="../css/profile-admin.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Barlow+Condensed:ital,wght@1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <!-- Statischer Ladebildschirm - schon sichtbar, bevor irgendein JS läuft
       (Animation läuft rein über CSS), damit beim Seitenwechsel nie kurz
       die halbfertige Seite aufblitzt. js/football-loader.js übernimmt
       dieses Element beim ersten FootballLoader.show()-Aufruf (siehe
       initPageWithLoader() in main.js) statt ein zweites zu erzeugen, und
       blendet es aus, sobald die echten Seitendaten da sind. -->
  <div class="fbl-overlay fbl-overlay--nfl" id="page-loader">
    <div class="fbl fbl--line fbl--nfl">
      <div class="fbl-nfl-brand">NFL POINTS</div>
      <svg class="fbl-nfl-icon" viewBox="-72 -72 144 144" aria-hidden="true" focusable="false">
        <defs><clipPath id="page-loader-clip"><path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/></clipPath></defs>
        <g transform="rotate(-45)">
          <path class="fbl-nfl-streak fbl-nfl-streak--1" d="M-61.5 -10.6H-85.5" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--2" d="M-67.2 5.9H-89.8" pathLength="100"/>
          <path class="fbl-nfl-streak fbl-nfl-streak--3" d="M-61.5 24.4H-72.3" pathLength="100"/>
        </g>
        <g clip-path="url(#page-loader-clip)"><g transform="rotate(-45)">
          <g class="fbl-nfl-laces"><path d="M-24 0H24M-20.5 -6.9V6.9M-7.5 -6.9V6.9M7.5 -6.9V6.9M20.5 -6.9V6.9"/></g>
        </g></g>
        <path d="M17.2 -37.8H31.8A6 6 0 0 1 37.8 -31.8V-17.2A55 55 0 0 1 -17.2 37.8H-31.8A6 6 0 0 1 -37.8 31.8V17.2A55 55 0 0 1 17.2 -37.8Z"/>
      </svg>
    </div>
  </div>
  <div id="navbar-container"></div>
  <main class="main-content">
    <div class="container container-sm">
      <!-- Back Link -->
      <a href="groups.html" class="back-link" data-testid="back-button">
        <i class="fas fa-arrow-left"></i>
        <span data-i18n="back_to_groups">Zurück zu Gruppen</span>
      </a>
      <div id="group-detail-container">
        <div class="loading-container">
          <div class="spinner spinner-lg"></div>
        </div>
      </div>
    </div>
  </main>
  <!-- Delete Group Modal -->
  <div id="delete-group-modal" class="modal">
    <div class="modal-backdrop" onclick="closeDeleteGroupModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="btn_delete_group">Gruppe löschen</h2>
      <p style="color: var(--muted); margin-bottom: 16px;" id="delete-group-text"></p>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeDeleteGroupModal()" data-i18n="btn_cancel">
          Abbrechen
        </button>
        <button class="btn btn-danger" style="flex: 1;" onclick="confirmDeleteGroup()" data-testid="confirm-delete" data-i18n="btn_delete">
          Löschen
        </button>
      </div>
    </div>
  </div>
  <!-- Leave Group Modal -->
  <div id="leave-group-modal" class="modal">
    <div class="modal-backdrop" onclick="closeLeaveGroupModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="btn_leave_group">Gruppe verlassen</h2>
      <p style="color: var(--muted); margin-bottom: 16px;" id="leave-group-text"></p>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeLeaveGroupModal()" data-i18n="btn_cancel">
          Abbrechen
        </button>
        <button class="btn btn-danger" style="flex: 1;" onclick="confirmLeaveGroup()" data-testid="confirm-leave" data-i18n="leave_word">
          Verlassen
        </button>
      </div>
    </div>
  </div>
  <!-- Edit Group Name Modal -->
  <div id="edit-name-modal" class="modal">
    <div class="modal-backdrop" onclick="closeEditNameModal()"></div>
    <div class="modal-content animate-scale-in">
      <h2 class="modal-title" data-i18n="title_change_name">Gruppenname ändern</h2>
      <form onsubmit="handleEditGroupName(event)">
        <div class="form-group">
          <label class="form-label" data-i18n="new_name_label">Neuer Name</label>
          <input type="text" id="edit-name-input" class="form-input" placeholder="Gruppenname" data-i18n-placeholder="label_group_name" required maxlength="50" data-testid="edit-name-input">
        </div>
        <div id="edit-name-error" class="error-message hidden"></div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeEditNameModal()" data-i18n="btn_cancel">
            Abbrechen
          </button>
          <button type="submit" class="btn btn-primary" style="flex: 1;" data-testid="save-name-btn" data-i18n="btn_save">
            Speichern
          </button>
        </div>
      </form>
      <p style="font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center;">
        <i class="fas fa-info-circle"></i>
        <span data-i18n="invite_code_unchanged">Der Einladungscode bleibt unverändert</span>
      </p>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" async></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" async></script>
  <script src="../js/config.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/football-loader.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/group-detail.js"></script>
</body>
</html>
