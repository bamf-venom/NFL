name: NFL Ergebnisse automatisch eintragen

on:
  schedule:
    # Alle 15 Minuten, rund um die Uhr. GitHub Actions cron läuft in UTC.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # erlaubt manuelles Auslösen über den "Actions" Tab

jobs:
  check-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        working-directory: automation
        run: npm install

      # Zuerst die Anstoßzeiten mit ESPN abgleichen (nur in den ersten 10 Minuten jeder
      # Stunde, siehe --hourly), damit ein von der NFL verlegtes Spiel (Flex-Scheduling)
      # noch im selben Lauf von check-scores.js richtig erkannt wird. Darf den
      # Ergebnis-Check und die Erinnerungen nie blockieren.
      - name: Anstoßzeiten mit ESPN abgleichen
        working-directory: automation
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node sync-game-times.js --apply --scope=window --hourly

      - name: Ergebnisse prüfen und eintragen
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-scores.js

      - name: Wett-Erinnerungen versenden
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node send-bet-reminders.js
