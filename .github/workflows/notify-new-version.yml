name: Neue-Version-Benachrichtigung senden

# Bewusst NUR manuell auslösbar (kein schedule) - der Nutzer will selbst
# entscheiden, wann ein Deploy tatsächlich eine "Update verfügbar"-Push-
# Benachrichtigung an alle abonnierten Nutzer wert ist, statt das automatisch
# bei jedem Commit/alle 15 Minuten zu prüfen.
on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        working-directory: automation
        run: npm install

      - name: Neue-Version-Benachrichtigung
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node notify-new-version.js
