name: Einmalig - E-Mail-Feld aus Nutzer-Dokumenten entfernen (manuell)

# NUR manuell auslösbar und nur einmal gebraucht. Entfernt das Feld "email" aus den Nutzer-Dokumenten in
# Firestore (die Adresse bleibt in Firebase Authentication). Ohne "apply" gibt es nur einen Trockenlauf:
# Anzahlen im Log, nichts wird geändert. Das Log dieses öffentlichen Repos zeigt ausschließlich Anzahlen,
# keine Adressen, Namen oder IDs. Nach getaner Arbeit wird dieser Workflow samt Skript wieder entfernt.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Feld wirklich entfernen (aus = Trockenlauf, nur zählen)'
        type: boolean
        default: false
      confirm:
        description: 'Nur beim Entfernen: Anzahl der Dokumente mit Feld "email" aus dem Trockenlauf eintippen'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren
        working-directory: automation
        run: npm install

      - name: Nutzer-Dokumente prüfen / bereinigen
        working-directory: automation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLEANUP_APPLY: ${{ inputs.apply }}
          CLEANUP_CONFIRM: ${{ inputs.confirm }}
        run: |
          ARGS=""
          if [ "$CLEANUP_APPLY" = "true" ]; then ARGS="--apply --confirm=$CLEANUP_CONFIRM"; fi
          echo "node remove-user-emails.js $ARGS"
          node remove-user-emails.js $ARGS
